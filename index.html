    <!-- SPA refresh handler for static hosts -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' || l.search.indexOf('?p=/') === 0 || l.search.indexOf('&p=/') >= 0) {
          var pMatch = l.search.match(/[?&]p=([^&]*)/);
          if (pMatch) {
            var path = decodeURIComponent(pMatch[1]).replace(/~and~/g, '&');
            var qMatch = l.search.match(/[?&]q=([^&]*)/);
            var query = qMatch ? '?' + decodeURIComponent(qMatch[1]).replace(/~and~/g, '&') : '';
            window.history.replaceState(null, null, path + query + l.hash);
          }
        }
      }(window.location));
    </script>
